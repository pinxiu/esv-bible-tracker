name: Daily Release Gatekeeper

on:
  schedule:
    - cron: '0 16 * * *' # Midnight Beijing time (16:00 UTC)
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write

jobs:
  check-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for releasable changes
        id: release_gate
        shell: bash
        run: |
          LATEST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"

          if [[ -z "$LATEST_TAG" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "No prior release tag exists; continuing with the release."
          elif git diff --quiet "$LATEST_TAG"..HEAD -- . ':(exclude).github/workflows/**'; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "No changes outside GitHub workflow files since $LATEST_TAG; skipping today's release."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Releasable changes found since $LATEST_TAG."
          fi

      - name: Setup Node.js
        if: steps.release_gate.outputs.should_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        if: steps.release_gate.outputs.should_release == 'true'
        run: npm ci

      - name: Build Web Application
        if: steps.release_gate.outputs.should_release == 'true'
        run: npm run build

      - name: Create and Push Release Branch
        if: steps.release_gate.outputs.should_release == 'true'
        id: branch_creation
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BRANCH_NAME="release/v$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          
          # Configure Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create and push branch
          git checkout -b $BRANCH_NAME
          git push origin $BRANCH_NAME --force

      - name: Run E2E Playwright Tests
        if: steps.release_gate.outputs.should_release == 'true'
        id: run_tests
        run: npm run test
        continue-on-error: true

      - name: Handle Test Failure
        if: steps.release_gate.outputs.should_release == 'true' && steps.run_tests.outcome == 'failure'
        run: |
          echo "❌ E2E regression tests failed on branch ${{ env.BRANCH_NAME }}!"
          exit 1

      - name: Send Failure Email Notification
        if: steps.release_gate.outputs.should_release == 'true' && failure() && env.SMTP_PASSWORD != ''
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ env.SMTP_PORT }}
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: "⚠️ Release Blocked: Daily E2E Test Failure (v${{ env.VERSION }})"
          to: pinxiu.gong@gmail.com
          from: "ESV Bible Tracker CI <ci@bibleplan.com>"
          body: |
            Hello,

            The daily E2E regression test run has failed for ESV Bible Tracker v${{ env.VERSION }}.
            
            The release branch "${{ env.BRANCH_NAME }}" has been kept open for your review.
            
            Please review the test failure details in the GitHub Action run logs:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            Best regards,
            ESV Bible Tracker CI
          secure: true

      - name: Run Release and Publish
        if: steps.release_gate.outputs.should_release == 'true' && steps.run_tests.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CODESIGN_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CODESIGN_P12_PASSWORD }}
        run: |
          npm run release
