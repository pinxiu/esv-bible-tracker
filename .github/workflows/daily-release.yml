name: Daily Release Gatekeeper

on:
  schedule:
    - cron: '0 16 * * *' # Midnight Beijing time (16:00 UTC)
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write

jobs:
  check-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for releasable changes
        id: release_gate
        shell: bash
        run: |
          LATEST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Manual release requested; bypassing the daily no-change gate."
          elif [[ -z "$LATEST_TAG" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "No prior release tag exists; continuing with the release."
          elif git diff --quiet "$LATEST_TAG"..HEAD -- . ':(exclude).github/workflows/**'; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "No changes outside GitHub workflow files since $LATEST_TAG; skipping today's release."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Releasable changes found since $LATEST_TAG."
          fi

      - name: Setup Node.js
        if: steps.release_gate.outputs.should_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        if: steps.release_gate.outputs.should_release == 'true'
        run: npm ci

      - name: Build Web Application
        if: steps.release_gate.outputs.should_release == 'true'
        env:
          VITE_APP_API_BASE_URL: ${{ vars.APP_API_BASE_URL }}
        run: npm run build

      - name: Create and Push Release Branch
        if: steps.release_gate.outputs.should_release == 'true'
        id: branch_creation
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BRANCH_NAME="release/v$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          
          # Configure Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create and push branch
          git checkout -b $BRANCH_NAME
          git push origin $BRANCH_NAME --force

      - name: Run E2E Playwright Tests
        if: steps.release_gate.outputs.should_release == 'true'
        id: run_tests
        env:
          VITE_APP_API_BASE_URL: ${{ vars.APP_API_BASE_URL }}
        run: npm run test
        continue-on-error: true

      - name: Handle Test Failure
        if: steps.release_gate.outputs.should_release == 'true' && steps.run_tests.outcome == 'failure'
        run: |
          echo "❌ E2E regression tests failed on branch ${{ env.BRANCH_NAME }}!"
          exit 1

      - name: Send Failure Email Notification
        if: steps.release_gate.outputs.should_release == 'true' && failure() && env.SMTP_PASSWORD != ''
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ env.SMTP_PORT }}
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: "⚠️ Release Blocked: Daily E2E Test Failure (v${{ env.VERSION }})"
          to: pinxiu.gong@gmail.com
          from: "ESV Bible Tracker CI <ci@bibleplan.com>"
          body: |
            Hello,

            The daily E2E regression test run has failed for ESV Bible Tracker v${{ env.VERSION }}.
            
            The release branch "${{ env.BRANCH_NAME }}" has been kept open for your review.
            
            Please review the test failure details in the GitHub Action run logs:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            Best regards,
            ESV Bible Tracker CI
          secure: true

      - name: Prepare Trusted macOS Signing Identity
        if: steps.release_gate.outputs.should_release == 'true' && steps.run_tests.outcome == 'success'
        env:
          SIGNING_P12_BASE64: ${{ secrets.MAC_CODESIGN_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.MAC_CODESIGN_P12_PASSWORD }}
        run: |
          set -euo pipefail
          EXPECTED_SHA1="9ABEB2177488BE80EFBA55B2E9646359A5667477"
          SIGNING_DIR="$RUNNER_TEMP/esv-signing"
          SIGNING_P12="$SIGNING_DIR/identity.p12"
          SIGNING_CERT="$SIGNING_DIR/identity.pem"
          SIGNING_KEYCHAIN="$RUNNER_TEMP/esv-signing.keychain-db"
          SIGNING_KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          mkdir -p "$SIGNING_DIR"
          printf '%s' "$SIGNING_P12_BASE64" | base64 --decode > "$SIGNING_P12"
          openssl pkcs12 -legacy -in "$SIGNING_P12" -clcerts -nokeys \
            -passin "pass:$SIGNING_P12_PASSWORD" -out "$SIGNING_CERT"

          ACTUAL_SHA1="$(openssl x509 -in "$SIGNING_CERT" -noout -fingerprint -sha1 | tr -d ':' | cut -d= -f2)"
          test "$ACTUAL_SHA1" = "$EXPECTED_SHA1"

          sudo security add-trusted-cert -d -r trustRoot \
            -k /Library/Keychains/System.keychain "$SIGNING_CERT"
          security create-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security import "$SIGNING_P12" -k "$SIGNING_KEYCHAIN" \
            -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$SIGNING_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security list-keychains -d user -s "$SIGNING_KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$SIGNING_KEYCHAIN" | grep "$EXPECTED_SHA1"

          echo "CSC_KEYCHAIN=$SIGNING_KEYCHAIN" >> "$GITHUB_ENV"
          echo "CSC_NAME=ESV Bible Tracker Developer" >> "$GITHUB_ENV"

      - name: Run Release and Publish
        if: steps.release_gate.outputs.should_release == 'true' && steps.run_tests.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CODESIGN_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CODESIGN_P12_PASSWORD }}
          VITE_APP_API_BASE_URL: ${{ vars.APP_API_BASE_URL }}
        run: |
          npm run release

      - name: Remove Temporary Signing Files
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/esv-signing"
          rm -f "$RUNNER_TEMP/esv-signing.keychain-db"
