name = "esv-bible-tracker-api"
main = "src/worker.js"
compatibility_date = "2026-07-29"

[vars]
GITHUB_REPOSITORY = "pinxiu/esv-bible-tracker"

[[r2_buckets]]
binding = "FEEDBACK_BUCKET"
bucket_name = "esv-bible-tracker-feedback"

[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 60
period = 60
